<!DOCTYPE html>
<html lang="es">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluacion js</title>
<!-- CSS -->
<link rel="stylesheet" href="static/css/style.css">
<!-- Conexion con bootstrap css -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <main class="container p-2 d-flex gap-3 flex-wrap">
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Ejercicio 1: </h5>
                <p class="card-text"> 1. pagos permisos de circulacion
                </p>
                <input type="text" class="form-control mb-3" id="input1" placeholder="Ingresar pago de permiso">
                <a href="#" class="btn btn-primary" onclick="moduloTesoreria()">Ejecutar</a>
                <div id="container1" class="mt-4 d-none">
                    <h5>Resultado:</h5>
                    <div id="result1" class="alert alert-success fw-bold"></div>
                </div>
            </div>
        </div>
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Ejercicio 2: </h5>
                <p class="card-text"> 2. Fila de vacunacion
                </p>
                <input type="text" class="form-control mb-3" id="input2" placeholder="Ingresar nombre">
                <a href="#" class="btn btn-primary" onclick=" ejercicio_2()">Priorizar</a>
                <a href="#" class="btn btn-primary" onclick=" paraAgregar()">Agregar</a>

                <div id="container2" class="mt-4 d-none">
                    <h5>Resultado:</h5>
                    <div id="result2" class="alert alert-success fw-bold"></div>
                </div>
            </div>
        </div>
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Ejercicio 3: </h5>
                <p class="card-text"> 3. Bsucar a beneficiarios
                </p>
                <input type="text" class="form-control mb-3" id="input3" placeholder="Ingresar nombre">
                <a href="#" class="btn btn-primary" onclick=" buscarBeneficios()">Ejecutar</a>
                <div id="container3" class="mt-4 d-none">
                    <h5>Resultado:</h5>
                    <div id="result3" class="alert alert-success fw-bold"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Conexion con js -->
    <script src="static/js/script.js"></script>
    <!-- JS bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
